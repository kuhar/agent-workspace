[queue]
poll_seconds = 120
push_quiet_seconds = 120
bootstrap_hours = 24
max_running = 2
max_wrappers = 3
min_free_gib = 50
start_mode = "active"

[ui]
theme = "catppuccin-mocha"

[[projects]]
name = "rocjitsu"
repo = "ROCm/rocm-systems"
query = "draft:false (team-review-requested:ROCm/rocjitsu-core-team OR user-review-requested:@me) -author:app/dependabot -author:@me"
include_paths = ["emulation/", "website/"]
launcher = "$JAKUB_ENV_DIR/agent-workspace/rocjitsu/review-pr.sh"
wrapper_root = "/mnt/dev/review-queue/rocjitsu"
estimated_wrapper_gib = 160
priority = 0
